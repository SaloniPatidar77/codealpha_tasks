{% extends "base.html" %}

{% block title %}Login - Loopup{% endblock %}

{% block content %}

<div class="card" style="max-width: 450px; margin: 50px auto;">

    <h1>Welcome Back 👋</h1>
    <p>Login to your Loopup account.</p>

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <br><br>

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <br><br>

        <button type="submit">Login</button>
    </form>

    <p>
        Don't have an account?
        <a href="{% url 'signup' %}">Create one</a>
    </p>

</div>

{% endblock %}
