{% extends "base.html" %}

{% block title %}Create Post - Loopup{% endblock %}

{% block content %}

<div class="card create-post-card">

    <h1>✨ Create a Post</h1>
    <p>Share something with the Loopup community.</p>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label for="content">What's on your mind?</label>

        <textarea
            id="content"
            name="content"
            rows="5"
            placeholder="Write something..."
        ></textarea>

        <br><br>

        <label for="image">📷 Add Image</label>

        <input
            id="image"
            type="file"
            name="image"
            accept="image/*"
        >

        <br><br>

        <label for="video">🎥 Add Video</label>

        <input
            id="video"
            type="file"
            name="video"
            accept="video/*"
        >

        <br><br>

        <button type="submit">
            🚀 Publish Post
        </button>

        <a href="{% url 'feed' %}">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
